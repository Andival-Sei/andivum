services:
  postgres:
    container_name: andivum-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANDIVUM_POSTGRES_DB:?Copy .env.example to .env and set a local database name}
      POSTGRES_USER: ${ANDIVUM_POSTGRES_USER:?Copy .env.example to .env and set a local database user}
      POSTGRES_PASSWORD: ${ANDIVUM_POSTGRES_PASSWORD:?Copy .env.example to .env and set a local-only password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - andivum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-test:
    container_name: andivum-postgres-test
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${ANDIVUM_TEST_POSTGRES_DB:?Copy .env.example to .env and set a test database name}
      POSTGRES_USER: ${ANDIVUM_TEST_POSTGRES_USER:?Copy .env.example to .env and set a test database user}
      POSTGRES_PASSWORD: ${ANDIVUM_TEST_POSTGRES_PASSWORD:?Copy .env.example to .env and set a local-only test password}
    ports:
      - "127.0.0.1:${ANDIVUM_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  andivum-postgres-data:
